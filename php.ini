[PHP]
; IMPORTANT : remplacez extension_dir par le chemin "ext" de VOTRE
; installation PHP si vous changez de machine ou de dossier PHP.
extension_dir = "C:\Users\LENOVO\Downloads\Compressed\php-8.5.2-nts-Win32-vs17-x64\ext"
extension = php_pdo_mysql.dll
extension = php_mysqli.dll
extension = php_mbstring.dll
extension = php_openssl.dll
extension = php_fileinfo.dll

; Le chemin de session n'est plus fixé ici : config/config.php le
; calcule automatiquement par rapport à l'emplacement du projet
; (dossier tmp/ à côté de config/), donc ça fonctionne même si vous
; déplacez ou réextrayez le dossier "DOSSIER IPASE" ailleurs.

date.timezone = Africa/Abidjan
display_errors = 0
log_errors = 1

; Desactive le cache pour les tests
opcache.enable_cli = 0
