<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>IPASE Admin Console</title>
  <link rel="stylesheet" href="../assets/css/modules/part1-base-hero.css" />
  <link rel="stylesheet" href="../assets/css/modules/part2-sections-cards.css" />
  <link rel="stylesheet" href="../assets/css/modules/part3-filieres-etudiant.css" />
  <link rel="stylesheet" href="../assets/css/modules/part4-dashboard-forms.css" />
  <link rel="stylesheet" href="../assets/css/modules/part5-footer-responsive.css" />
  <style>
    :root {
      --app-bg: #eef3fb;
      --panel-bg: #ffffff;
      --accent: #0b2d6b;
      --accent-2: #0f4fb8;
      --text: #12233f;
      --muted: #64748b;
      --danger: #b91c1c;
      --border: #d8e3f6;
    }

    body {
      margin: 0;
      background: linear-gradient(135deg, #f4f7fd 0%, #e8eefb 100%);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
    }

    .admin-app-shell {
      max-width: 1320px;
      margin: 28px auto;
      padding: 24px;
    }

    .admin-login-card,
    .admin-dashboard-card {
      background: var(--panel-bg);
      border: 1px solid rgba(11, 45, 107, 0.12);
      border-radius: 26px;
      box-shadow: 0 18px 55px rgba(15, 42, 94, 0.12);
      padding: 28px;
    }

    .admin-login-card {
      background:
        radial-gradient(circle at top left, rgba(15, 79, 184, 0.10), transparent 40%),
        #ffffff;
    }

    .form-intro h3 {
      margin: 0 0 6px;
      color: var(--accent);
      font-size: 1.6rem;
    }

    .form-intro p {
      margin: 0 0 18px;
      color: var(--muted);
    }

    .admin-topbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--border);
    }

    .admin-topbar h1 {
      margin: 0;
      font-size: 1.65rem;
      color: var(--accent);
    }

    .admin-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin: 20px 0 28px;
    }

    .admin-stat-card {
      background: linear-gradient(180deg, #f9fbff 0%, #f5f8fe 100%);
      border: 1px solid var(--border);
      border-radius: 18px;
      padding: 16px;
    }

    .admin-stat-card small {
      color: var(--muted);
      text-transform: uppercase;
      font-size: 0.72rem;
      letter-spacing: 0.04em;
    }

    .admin-stat-card strong {
      display: block;
      margin-top: 8px;
      font-size: 1.45rem;
      color: var(--accent);
    }

    .admin-utils {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
      gap: 12px;
      margin-bottom: 20px;
    }

    .admin-utils .form-group,
    .styled-form .form-group {
      margin: 0 0 16px;
    }

    .form-group label {
      display: block;
      margin-bottom: 8px;
      font-weight: 700;
      color: var(--text);
    }

    .form-group input,
    .form-group select,
    .form-group textarea,
    .admin-row input,
    .admin-row select,
    .admin-row textarea {
      width: 100%;
      border: 1px solid #b9caeb;
      border-radius: 12px;
      padding: 12px 14px;
      font-size: 0.96rem;
      box-sizing: border-box;
      background: #fbfdff;
    }

    .form-group input:focus,
    .form-group select:focus,
    .form-group textarea:focus,
    .admin-row input:focus,
    .admin-row select:focus,
    .admin-row textarea:focus {
      outline: none;
      border-color: var(--accent-2);
      box-shadow: 0 0 0 3px rgba(15, 79, 184, 0.16);
    }

    .btn-submit-form {
      border: 0;
      background: linear-gradient(135deg, var(--accent) 0%, var(--accent-2) 100%);
      color: white;
      padding: 14px 18px;
      border-radius: 14px;
      cursor: pointer;
      font-weight: 700;
      transition: transform 0.16s ease, box-shadow 0.16s ease;
      box-shadow: 0 8px 20px rgba(11, 45, 107, 0.2);
    }

    .btn-submit-form:hover {
      transform: translateY(-1px);
    }

    .btn-submit-form.full {
      width: 100%;
      margin-top: 8px;
    }

    .admin-tab-nav {
      display: flex;
      gap: 10px;
      margin-bottom: 18px;
      flex-wrap: wrap;
    }

    .admin-table {
      display: grid;
      gap: 14px;
    }

    .admin-row {
      border: 1px solid var(--border);
      border-radius: 16px;
      padding: 16px;
      background: linear-gradient(180deg, #fbfdff 0%, #f8fbff 100%);
    }

    .admin-row .toolbar {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      margin-top: 14px;
    }

    .admin-row .toolbar > * {
      min-width: 180px;
      flex: 1 1 180px;
    }

    .admin-row textarea {
      min-height: 72px;
      resize: vertical;
    }

    .alert-error {
      background: #fff1f1;
      color: var(--danger);
      padding: 12px 14px;
      border-radius: 12px;
      margin-bottom: 14px;
      border: 1px solid #fecdd3;
    }

    .hidden {
      display: none !important;
    }
  </style>
</head>
<body>
  <div class="admin-app-shell">
    <div class="admin-login-card" id="admin-login-card">
      <div class="form-intro">
        <h3>Console administration IPASE</h3>
        <p>Portail d’administration réservé au personnel et au secrétariat.</p>
      </div>
      <div id="admin-login-error" class="alert-error hidden"></div>
      <form id="admin-login-form" class="styled-form">
        <div class="form-group">
          <label for="admin-username">Nom d’utilisateur</label>
          <input type="text" id="admin-username" placeholder="admin" value="admin" required />
        </div>
        <div class="form-group">
          <label for="admin-password">Mot de passe</label>
          <input type="password" id="admin-password" placeholder="••••••••" value="Admin@ipase2026" required />
        </div>
        <button type="submit" class="btn-submit-form full">
          <i class="fa-solid fa-right-to-bracket"></i> Se connecter à l’application admin
        </button>
      </form>
    </div>

    <div class="admin-dashboard-card hidden" id="admin-dashboard-card">
      <div class="admin-topbar">
        <h1>IPASE Admin Desktop</h1>
        <button type="button" id="admin-logout-btn" class="btn-submit-form">
          <i class="fa-solid fa-power-off"></i> Déconnexion
        </button>
      </div>

      <div class="admin-grid" id="admin-stats-grid"></div>

      <div class="admin-utils">
        <div class="form-group">
          <label for="admin-filter-filiere">Filière</label>
          <select id="admin-filter-filiere">
            <option value="">Toutes</option>
            <option value="INFO">INFO</option>
            <option value="COMPTA">COMPTA</option>
            <option value="COMM">COMM</option>
            <option value="GRH">GRH</option>
            <option value="BANQUE">BANQUE</option>
          </select>
        </div>
        <div class="form-group">
          <label for="admin-filter-niveau">Niveau</label>
          <select id="admin-filter-niveau">
            <option value="">Tous</option>
            <option value="L1">L1</option>
            <option value="L2">L2</option>
            <option value="L3">L3</option>
            <option value="M1">M1</option>
            <option value="M2">M2</option>
          </select>
        </div>
        <div class="form-group">
          <label for="admin-filter-statut">Statut</label>
          <select id="admin-filter-statut">
            <option value="">Tous</option>
            <option value="En attente">En attente</option>
            <option value="Validée">Validée</option>
            <option value="Annulée">Annulée</option>
          </select>
        </div>
        <div class="form-group">
          <label for="admin-search">Recherche</label>
          <input type="text" id="admin-search" placeholder="Nom, email, matricule..." />
        </div>
      </div>

      <div class="admin-tab-nav" style="display:flex; gap:10px; margin-bottom:18px; flex-wrap:wrap;">
        <button type="button" class="btn-submit-form" id="btn-tab-students">Étudiants</button>
        <button type="button" class="btn-submit-form" id="btn-tab-messages">Messages</button>
        <button type="button" class="btn-submit-form" id="btn-tab-report">Rapports</button>
        <button type="button" class="btn-submit-form" id="btn-admin-export-excel">Exporter Excel</button>
      </div>

      <div id="admin-students-panel" class="admin-table"></div>
      <div id="admin-messages-panel" class="admin-table hidden"></div>
      <div id="admin-report-panel" class="admin-table hidden"></div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
